<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabin Crew Academy — Complete CCOM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cabin Crew">
<meta name="theme-color" content="#07111f">
<style>
:root{--bg:#07111f;--p:#0d1b2d;--p2:#11243b;--t:#f5f8fc;--m:#9fb0c5;--a:#58a6ff;--g:#41d17d;--r:#ff647c;--b:rgba(255,255,255,.09)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(180deg,#07111f,#09182a);color:var(--t);min-height:100vh}.app{max-width:1100px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{margin:0;font-size:clamp(24px,5vw,40px)}.muted{color:var(--m)}.pill,.hero,.card,.quiz{border:1px solid var(--b);background:rgba(13,27,45,.92);border-radius:20px}.pill{padding:9px 13px;font-weight:800}.hero{padding:20px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:11px}.card{padding:16px;cursor:pointer}.card:hover{border-color:#58a6ff}.card h3{margin:0 0 6px}.tag{display:inline-block;margin-top:10px;padding:5px 8px;border-radius:8px;background:#142f4d;color:#9dcbff;font-size:12px}.progress{height:9px;background:#192d45;border-radius:99px;overflow:hidden;margin:10px 0}.progress div{height:100%;background:linear-gradient(90deg,var(--a),var(--g))}.primary,.secondary{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--a);color:#04111f}.secondary{background:#18314e;color:white}.view{display:none}.view.on{display:block}.quiz{padding:21px}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--m);margin-bottom:10px}.question{font-size:21px;line-height:1.45;margin:18px 0}.answers{display:grid;gap:9px}.ans{padding:13px;text-align:left;border:1px solid var(--b);border-radius:12px;background:var(--p2);color:white;cursor:pointer}.ans.sel{outline:2px solid var(--a)}.ans.good{border-color:var(--g);background:rgba(65,209,125,.14)}.ans.bad{border-color:var(--r);background:rgba(255,100,124,.14)}.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;background:#10253c;line-height:1.5}.feedback.on{display:block}.actions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}.back{background:none;border:0;color:#9dcbff;padding:8px 0;cursor:pointer}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters button{padding:8px 11px;border-radius:10px;border:1px solid var(--b);background:#122842;color:white;cursor:pointer}.chpick{display:flex;align-items:center;gap:7px;padding:9px 11px;border:1px solid var(--b);border-radius:10px;background:#122842;cursor:pointer}.chpick input{accent-color:var(--a);width:17px;height:17px}
@media(max-width:600px){.app{padding:13px}.question{font-size:18px}.meta{font-size:12px}}</style></head><body><div class="app">
<div class="top"><div><h1>✈ Cabin Crew Academy</h1><div class="muted">CCOM FOE • întrebări în română bazate pe CCOM</div></div><div style="display:flex;gap:8px;align-items:center"><div class="pill" id="offlineStatus">Verificare…</div><div class="pill" id="xp">0 XP</div></div></div>
<section id="home" class="view on"><div class="hero"><h2 style="margin-top:0">Cabin Crew Academy — Română</h2><div id="summary" class="muted"></div><div class="progress"><div id="allProg"></div></div><div class="actions"><button class="primary" onclick="startRandom()">Random Examen — 50</button><button class="secondary" onclick="startGreșeli()">Greșeli</button></div>
<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--b)">
  <h3 style="margin:0 0 5px">Test personalizat</h3>
  <div class="muted">Selectează orice capitol sau mai multe capitole.</div>
  <div id="chapterChecks" class="filters"></div>
  <div class="actions">
    <button class="secondary" onclick="selectAllChapters()">Selectează toate</button>
    <button class="secondary" onclick="clearChapters()">Șterge selecția</button>
    <select id="customCount" class="secondary" style="border:0">
      <option value="10">10 întrebări</option><option value="20">20 întrebări</option>
      <option value="30">30 întrebări</option><option value="50" selected>50 întrebări</option>
      <option value="100">100 întrebări</option><option value="all">Toate întrebările selectate</option>
    </select>
    <button class="primary" onclick="startCustom()">Începe capitolele selectate</button>
  </div>
</div></div><div class="grid" id="grid"></div></section>
<section id="quizView" class="view"><button class="back" onclick="goHome()">← Chapters</button><div class="quiz"><div class="meta"><span id="section"></span><span id="count"></span></div><div class="progress"><div id="qprog"></div></div><div class="question" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="actions"><button id="check" class="primary" disabled onclick="check()">Verifică răspunsul</button><button id="next" class="secondary" style="display:none" onclick="next()">Următoarea</button></div></div></section>
</div><script src="data.js"></script><script>
const DATA=window.CCA_DATA;let st=JSON.parse(localStorage.getItem("ccaComplete")||'{"xp":0,"answered":0,"mistakes":{}}');let bank=[],i=0,sel=null,locked=false,score=0;
const $=x=>document.getElementById(x);function save(){localStorage.setItem("ccaComplete",JSON.stringify(st));$("xp").textContent=st.xp+" XP";$("summary").textContent=DATA.questions.length+" curated natural questions • "+st.answered+" answers checked";$("allProg").style.width=Math.min(100,st.answered/Math.max(1,DATA.questions.length)*100)+"%"}
function grid(){DATA.chapters.forEach(c=>{let d=document.createElement("div");d.className="card"+(c.count?"":" lock");d.innerHTML=`<h3>${c.code} • ${c.title}</h3><div class="muted">${c.count?c.count+" natural questions":"În curs de completare"}</div><span class="tag">${c.count?"DISPONIBIL":"ÎN CURÂND"}</span>`;if(c.count)d.onclick=()=>startChapter(c.code);$("grid").appendChild(d)})}
function show(id){document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));$(id).classList.add("on");scrollTo(0,0)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function startChapter(c){bank=DATA.questions.filter(q=>q.chapter===c);if(!bank.length){alert("This chapter is being rebuilt with natural questions.");return}begin()}function startRandom(){bank=shuffle(DATA.questions).slice(0,50);begin()}function startGreșeli(){let ks=Object.keys(st.mistakes);bank=DATA.questions.filter((q,idx)=>ks.includes(q.chapter+"|"+q.page+"|"+q.q));if(!bank.length){alert("No saved mistakes yet.");return}begin()}
function begin(){i=0;score=0;show("quizView");render()}function render(){let x=bank[i];sel=null;locked=false;$("section").textContent=`Chapter ${x.chapter} • CCOM p.${x.page}`;$("count").textContent=`${i+1} / ${bank.length}`;$("qprog").style.width=(i/bank.length*100)+"%";$("q").textContent=x.q;$("answers").innerHTML="";x.a.forEach((a,n)=>{let b=document.createElement("button");b.className="ans";b.textContent=String.fromCharCode(65+n)+". "+a;b.onclick=()=>choose(n,b);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("check").disabled=true;$("check").style.display="";$("next").style.display="none"}
function choose(n,b){if(locked)return;sel=n;document.querySelectorAll(".ans").forEach(z=>z.classList.remove("sel"));b.classList.add("sel");$("check").disabled=false}
function check(){if(sel===null||locked)return;locked=true;let x=bank[i],bs=[...document.querySelectorAll(".ans")],key=x.chapter+"|"+x.page+"|"+x.q;bs[x.c].classList.add("good");st.answered++;if(sel!==x.c){bs[sel].classList.add("bad");st.mistakes[key]=(st.mistakes[key]||0)+1}else{score++;st.xp+=10;delete st.mistakes[key]}save();$("feedback").className="feedback on";$("feedback").innerHTML=(sel===x.c?"<b>✓ Corect</b>":"<b>✕ Greșit</b>")+"<br>"+x.e+` <span class="muted">[CCOM p.${x.page}]</span>`;$("check").style.display="none";$("next").style.display="";$("next").textContent=i===bank.length-1?"Results":"Următoarea"}
function next(){if(i<bank.length-1){i++;render()}else{document.querySelector(".quiz").innerHTML=`<div style="text-align:center;padding:25px"><div class="muted">SESSION COMPLETE</div><h1 style="font-size:55px;margin:8px">${score}/${bank.length}</h1><p>${Math.round(score/bank.length*100)}% correct</p><button class="primary" onclick="location.reload()">Back home</button></div>`}}
function buildChapterChecks(){let box=$("chapterChecks");DATA.chapters.filter(c=>c.count>0).forEach(c=>{let l=document.createElement("label");l.className="chpick";l.innerHTML=`<input type="checkbox" class="chapterPick" value="${c.code}"><span><b>${c.code}</b> ${c.title}</span>`;box.appendChild(l)})}
function selectedChapters(){return [...document.querySelectorAll(".chapterPick:checked")].map(x=>x.value)}
function selectAllChapters(){document.querySelectorAll(".chapterPick").forEach(x=>x.checked=true)}
function clearChapters(){document.querySelectorAll(".chapterPick").forEach(x=>x.checked=false)}
function startCustom(){let cs=selectedChapters();if(!cs.length){alert("Select at least one chapter.");return}let pool=shuffle(DATA.questions.filter(q=>cs.includes(q.chapter)));let n=$("customCount").value;bank=n==="all"?pool:pool.slice(0,Math.min(Number(n),pool.length));begin()}
function goHome(){location.reload()}buildChapterChecks();grid();save();</script>
<script>
function updateOfflineStatus(){
  const el=document.getElementById("offlineStatus");
  if(!el) return;
  el.textContent = navigator.onLine ? "Online" : "Offline ✓";
}
window.addEventListener("online", updateOfflineStatus);
window.addEventListener("offline", updateOfflineStatus);
updateOfflineStatus();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(console.error);
  });
}
</script>
</body></html>
